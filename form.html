<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form Project</title>
    <meta name="author" content="Nathan Javier">
    <meta name="description" content="Product Review Form to full-up and submit for improvement of the product.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilex:wght@100..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>

        <h1>Product Review</h1>

    </header>

    <main>
        <form method="get" action="review.html">
            <div>
                <label for="productName">Product Name</label><br>
                <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>


            <label>Overall Rating</label>

            <label for="rating1">
            <input type="radio" id="rating1" name="rating" value="1" required>☆</label>

            <label for="rating2">
            <input type="radio" id="rating2" name="rating" value="2" required>☆☆</label>

            <label for="rating3">
            <input type="radio" id="rating3" name="rating" value="3" required>☆☆☆</label>

            <label for="rating4">
            <input type="radio" id="rating4" name="rating" value="4" required>☆☆☆☆</label>

            <label for="rating5">
            <input type="radio" id="rating5" name="rating" value="5" required>☆☆☆☆☆</label>


            <div>
                <label for="installDate">Date of Installation</label><br>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <label>Useful Features</label>

            <label for="feature1">
            <input type="checkbox" id="feature1" name="features" value="Easy Setup">Easy Setup</label><br>

            <label for="feature2">
            <input type="checkbox" id="feature2" name="features" value="Durability">Durability</label><br>

            <label for="feature3">
            <input type="checkbox" id="feature3" name="features" value="Performance">Performance</label><br>

            <label for="feature4">
            <input type="checkbox" id="feature4" name="features" value="Design">Design</label>

            <div>
                <label for="review">Written Review</label><br>
                <textarea id="review" name="review" rows="5" cols="40"></textarea>
            </div>

        
            <div>
                <label for="userName">Your Name</label><br>
                <input type="text" id="userName" name="userName">
            </div>

            <div>
                <input type="submit" value="Submit Review">
            </div>
        </form>

    </main>
    <footer>
        <p>© <span id="currentYear"></span> | Nathan Javier | Philippines</p>
        <p>Last Modification: <span id="lastModified"></span></p>

    </footer>
    
</body>
</html>
